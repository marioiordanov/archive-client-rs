[package]
name = "archive-client-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
dotenvy = "0.15.7"
env_logger = "0.11.8"
http-body-util = "0.1.3"
hyper = { version = "1.8.1", features = ["client", "full", "http1", "server"] }
hyper-util = { version = "0.1.19", features = ["tokio"] }
iced = { version = "0.14.0", features = ["tokio", "advanced"] }
lazy_static = "1.5.0"
log = "0.4.29"
mime_guess = "2.0.5"
notify = "6.1.1"
reqwest = { version = "0.13.1", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["io-std", "io-util", "macros", "net"] }
url = "2.5.8"
warp = "0.4.2"
webbrowser = { version = "1.0.6", features = ["hardened", "disable-wsl"] }

[features]
default = ["mock_org"]
mock_org = []
