<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign-in Complete</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #ded7e6 100%);
        color: #333;
      }
      .container {
        background: white;
        padding: 3rem 2.5rem;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        text-align: center;
        max-width: 400px;
      }
      .checkmark {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: #4caf50;
        margin: 0 auto 1.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .checkmark::after {
        content: "✓";
        color: white;
        font-size: 2.5rem;
        font-weight: bold;
      }
      h1 {
        font-size: 1.75rem;
        margin-bottom: 0.75rem;
        color: #2c3e50;
      }
      p {
        font-size: 1rem;
        line-height: 1.6;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="checkmark"></div>
      <h1>Sign-in Complete</h1>
      <p>You can close this window and return to the desktop application.</p>
    </div>
  </body>
</html>"
